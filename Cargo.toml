[package]
name = "herdr-switchboard"
version = "1.1.0"
edition = "2021"
description = "Colorful Herdr command palette for projects, command history, and local TCP ports."
license = "MIT"

[[bin]]
name = "herdr-switchboard"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde_json = "1"
nucleo-matcher = "0.3"
ansi-to-tui = "7"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = { version = "0.23", features = ["serde"] }
regex = "1"
sha2 = "0.10"
listeners = "0.6"
sysinfo = { version = "0.39", default-features = false, features = ["system", "user"] }

# Favour a fast first-run build (the wrapper builds on demand) over a maximally
# small binary; still strip symbols to keep it lean.
[profile.release]
opt-level = "s"
strip = true
