[package]
name = "herdr-switchboard"
version = "2.1.0"
edition = "2021"
description = "Colorful Herdr command palette for projects, command history, and local TCP ports."
license = "MIT"

[[bin]]
name = "herdr-switchboard"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde_json = "1"
nucleo-matcher = "0.3"
ansi-to-tui = "7"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = { version = "0.23", features = ["serde"] }
regex = "1"
sha2 = "0.10"
listeners = "0.6"
sysinfo = { version = "0.39", default-features = false, features = ["system", "user"] }

# Two consumers build this crate, and they want opposite things.
#
# `release` is the one `bin/picker.sh` falls back to when there is no versioned
# archive: an offline install or a linked checkout, built on the user's machine
# while they wait for a pane to open. Compile time is theirs, so favour it.
[profile.release]
opt-level = "s"
strip = true

# `dist` is what the release workflow ships. Its compile time belongs to CI and
# its run time belongs to whoever installs the archive, so this end is optimised
# without regard for how long the build takes.
[profile.dist]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
