# Switchboard config: $(herdr plugin config-dir switchboard)/config.toml
# Every key is optional. Settings edits these same namespaced tables.

[common]
keymode = "insert" # insert | normal
title_color = "peach"
transparency = "auto"
update_check = true
notifications = true
notification_position = "top-right"
notification_sound = "auto" # auto | none | done | request

[projects]
default_target = "workspace" # workspace | tab | split | pane
split_direction = "right"
split_ratio = "0.5"
label = "repo"
include_agents = true
include_workspaces = true
include_worktrees = true
default_tab = "all"
sort = "recent"
preview = "enabled"
preview_position = "right"
preview_size = "60%"
preview_readme = true

[commands]
history_limit = 5000
sort = "frecency" # frecency | recent | frequency | alphabetical
# Rust regexes applied before a command enters the catalog.
history_exclude = ["(?i)private[_-]?key"]

[[commands.presets]]
label = "Run tests"
command = "cargo test"
cwd = "origin" # origin or an absolute directory

[ports]
refresh_interval_ms = 2000 # minimum 250

[clone]
source = "clipboard"
open_after = true

[git]
base_branch = ""
# Ask before an all-files review of a tree bigger than this; 0 never asks.
all_files_warn = 1500

[zen]
# The zen'd pane's share of the tab; the rest is split evenly into two gutters.
width = 70
# Dim the gutters. Needs `[experimental] kitty_graphics = true` in herdr's own
# config — without it the gutters stay blank rather than dark, and nothing errors.
scrim = true
# Herdr composites the scrim opaquely, so this is the colour the gutters become,
# not a tint over what is under them.
scrim_color = "#11111b"
# How much of herdr's *own* chrome a zen session hides. Herdr has no per-pane or
# per-tab switch for any of it, so anything but "off" rewrites `[ui]` keys in
# herdr's own config.toml for the length of the session and puts them back on the
# way out.
#   off   — nothing outside this plugin is touched (default)
#   panes — pane_borders, pane_gaps, pane_scrollbars
#   full  — also hide_tab_bar_when_single_tab and the sidebar keys
chrome = "off"

[usage]
# Which quota providers the Usage popup shows, in display order. Codex reads its
# number straight off disk; Claude asks the same endpoint `/usage` does, which
# needs its OAuth token out of the keychain and one HTTPS request.
providers = ["codex", "claude"]
timeout_ms = 3000
# Where a donut turns yellow, then red.
warn_percent = 60
alert_percent = 85

# Picker-specific remaps. Projects keeps its full existing action vocabulary;
# Commands and Ports use the action ids printed in their footer.
[keys.agents]
# pane = "enter"
# tab = "ctrl-t"
# workspace = "alt-w"

[keys.commands]
# copy = "ctrl-y"

[keys.ports]
# workspace = "ctrl-w"

[keys.zen]
# zen = "enter"
# exit = "ctrl-x"
