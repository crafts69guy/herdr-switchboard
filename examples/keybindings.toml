# herdr accepts one key after the prefix (chords like "prefix+p+t" are
# invalid), so the recommended setup is a single key for the picker, which
# fans out to every open target via the popup's ctrl-keys.
#
# Add this to ~/.config/herdr/config.toml, then `herdr server reload-config`.

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "switchboard.menu"
description = "Switchboard menu"

# Direct pickers skip the central menu. Bind any or all of them.
# command = "switchboard.projects"
# command = "switchboard.commands"
# command = "switchboard.ports"

# Optional: list installed AI integrations and start one in the current pane,
# a new tab, or a new workspace.
# [[keys.command]]
# key = "prefix+a"
# type = "plugin_action"
# command = "switchboard.agents"
# description = "Start an AI agent"

# Optional: subscription quota for the AI agents you have installed.
# [[keys.command]]
# key = "prefix+u"
# type = "plugin_action"
# command = "switchboard.usage"
# description = "AI usage"

# Optional: open the git menu (tuicr review + lazygit) for the current repo, in
# its own pane. This is the only way to reach it — the switcher has no git key.
# [[keys.command]]
# key = "prefix+g"
# type = "plugin_action"
# command = "switchboard.git"
# description = "Git menu"

# Optional: zen mode. `zen-toggle` acts on the pane you press it in and opens no
# picker, which is what makes it worth a dedicated key; `switchboard.zen` opens a
# picker to zen some other pane.
# [[keys.command]]
# key = "prefix+z"
# type = "plugin_action"
# command = "switchboard.zen-toggle"
# description = "Toggle zen on this pane"

# Optional: a dedicated clone key.
# [[keys.command]]
# key = "prefix+alt+p"
# type = "plugin_action"
# command = "switchboard.clone"
# description = "Clone a repository (ghq get)"

# Optional hot-path bindings — pick a repo with Enter forced to one target:
# [[keys.command]]
# key = "prefix+alt+t"
# type = "plugin_action"
# command = "switchboard.open-tab"
# description = "Open a repo in a new tab"

# [[keys.command]]
# key = "prefix+alt+s"
# type = "plugin_action"
# command = "switchboard.open-split"
# description = "Open a repo in a split"
