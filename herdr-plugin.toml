id = "switchboard"
name = "Switchboard"
version = "1.2.0"
min_herdr_version = "0.8.0"
description = "A colorful Herdr command palette with searchable Projects, AI Agents, Commands, and Ports pickers plus Git, Clone, Settings, Changelog, and Update utilities."
platforms = ["macos", "linux"]

[[actions]]
id = "menu"
title = "Switchboard Menu"
description = "Open the central menu for every Switchboard picker and utility."
contexts = ["global", "pane"]
command = ["bash", "bin/action.sh"]

[[actions]]
id = "projects"
title = "Projects"
description = "Open the switcher over running agents, open workspaces, ghq repositories, and linked worktrees."
contexts = ["global", "pane"]
command = ["bash", "bin/action.sh"]

[[actions]]
id = "agents"
title = "AI Agents"
description = "Start an installed Herdr AI integration in the current pane, a new tab, or a new workspace."
contexts = ["global", "pane"]
command = ["bash", "bin/action.sh"]

[[actions]]
id = "usage"
title = "Usage"
description = "Show subscription quota for the installed AI agents: how much of the plan is spent, when it resets, and when it renews."
contexts = ["global", "pane"]
command = ["bash", "bin/action.sh"]

[[actions]]
id = "commands"
title = "Commands"
description = "Search shell history and presets, then fill or run the exact command."
contexts = ["global", "pane"]
command = ["bash", "bin/action.sh"]

[[actions]]
id = "ports"
title = "Ports"
description = "Inspect live TCP listeners and safely act on their owner processes."
contexts = ["global", "pane"]
command = ["bash", "bin/action.sh"]

[[actions]]
id = "settings"
title = "Switchboard Settings"
description = "Configure the common, projects, commands, and ports modes."
contexts = ["global", "pane"]
command = ["bash", "bin/action.sh"]

[[actions]]
id = "git"
title = "Git Menu"
description = "Open the git menu for the current repo in its own pane: review the worktree, a branch, or a commit with tuicr, or stage with lazygit."
contexts = ["global", "pane"]
command = ["bash", "bin/action.sh"]

[[actions]]
id = "clone"
title = "Clone Repository"
description = "Clone a repository with ghq get (from clipboard or a prompt), then open it."
contexts = ["global", "pane"]
command = ["bash", "bin/action.sh"]

[[actions]]
id = "update"
title = "Update Switchboard"
description = "Install the newest tagged version of this plugin. Refuses to touch a linked checkout."
contexts = ["global", "pane"]
command = ["bash", "bin/action.sh"]

[[actions]]
id = "changelog"
title = "Switchboard Changelog"
description = "Read what changed in this plugin, including the version you have installed."
contexts = ["global", "pane"]
command = ["bash", "bin/action.sh"]

[[actions]]
id = "zen"
title = "Zen"
description = "Pick a pane; it moves to a tab of its own, centred between two dimmed gutters."
contexts = ["global", "pane"]
command = ["bash", "bin/action.sh"]

# The only action that opens no pane: it acts on the pane you pressed it in, so
# a dedicated key toggles zen without a picker ever appearing.
[[actions]]
id = "zen-toggle"
title = "Toggle Zen"
description = "Put the current pane in zen, or bring it back if it is already there."
contexts = ["global", "pane"]
command = ["bash", "bin/action.sh"]

# Optional hot-path actions: open the picker with the Enter target forced, so a
# dedicated key always lands the chosen repo in a workspace / tab / split.
[[actions]]
id = "open-workspace"
title = "Open Repo in Workspace"
description = "Pick a repo; Enter opens it in a new workspace."
contexts = ["global", "pane"]
command = ["bash", "bin/action.sh"]

[[actions]]
id = "open-tab"
title = "Open Repo in Tab"
description = "Pick a repo; Enter opens it in a new tab."
contexts = ["global", "pane"]
command = ["bash", "bin/action.sh"]

[[actions]]
id = "open-split"
title = "Open Repo in Split"
description = "Pick a repo; Enter opens it in a split of the current pane."
contexts = ["global", "pane"]
command = ["bash", "bin/action.sh"]

[[panes]]
id = "menu"
title = "󰍜"
placement = "popup"
width = 76
height = 24
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/bin/picker.sh\" --menu"]

[[panes]]
id = "projects"
title = "󰊢"
placement = "overlay"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/bin/picker.sh\""]

[[panes]]
id = "agents"
title = "󰚩"
placement = "popup"
width = 100
height = 26
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/bin/picker.sh\" --agents"]

[[panes]]
id = "usage"
title = "󰊚"
placement = "popup"
width = 96
height = 26
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/bin/picker.sh\" --usage"]

[[panes]]
id = "commands"
title = "󰆍"
placement = "overlay"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/bin/picker.sh\" --commands"]

[[panes]]
id = "ports"
title = "󰛳"
placement = "overlay"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/bin/picker.sh\" --ports"]

[[panes]]
id = "zen"
title = "󰄄"
placement = "overlay"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/bin/picker.sh\" --zen"]

[[panes]]
id = "settings"
title = "Switchboard Settings"
placement = "popup"
width = 100
height = 32
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/bin/picker.sh\" --settings"]

[[panes]]
id = "git"
title = "󰊢"
placement = "overlay"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/bin/git.sh\""]

[[panes]]
id = "clone"
title = "Clone Repository"
placement = "overlay"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/bin/get.sh\""]

[[panes]]
id = "update"
title = "Update Switchboard"
placement = "overlay"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/bin/update-plugin.sh\""]

[[panes]]
id = "changelog"
title = "Switchboard Changelog"
placement = "popup"
width = 88
height = 28
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/bin/changelog.sh\""]
